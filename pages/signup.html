<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Estates</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="../style/signup.css">
</head>
<body>
    <div class="container">
    <div class="card">
    <div class="image">
    <img src="../assets/login-image.jpg" alt="Property Image">
    <div class="image-text">
    <h1>Skyline Estates</h1>
    <p>Luxury Living in Dubai</p>
    </div>
    </div>
    <form class="form">
    <div class="heading">
        <h2>Welcome To Skyline Etates</h2>
        </div>
        <div class="user">
        <input type="text" id="text" name="text" placeholder="Name" required><br><br>
        <input type="email" id="email" name="email" placeholder="Email" required><br><br>
        <input type="password" id="pass" name="pass" placeholder="Password" minlength="8" required><br><br>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" minlength="8" required>
        </div>
        <button type="submit" class="button">LOGIN</button>
        <p class="acc">Already have an account? <a href="../pages/login.html">Log-In</a></p>
        <h5>OR</h5>
        <div class="loginwith">
        <a href="#"><img src="../assets/facebook-logo.svg" alt="Facebook"></a>
        <a href="#"><img src="../assets/twitterX-logo.svg" alt="Twitter"></a>
        <a href="#"><img src="../assets/medium-logo.svg" alt="Medium"></a>
      </div>
    </form>
    </div>
    </div>
</body>
</html>
