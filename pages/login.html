<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Estates | Login</title>
    <link rel="icon" href="../assets/favicon.png">

</head>
<body>
    <div class="container">
    <div class="card">
    <div class="image">
    <img src="../assets/login-image.jpg" alt="Property Image">
    <div class="image-text">
    <h1>Welcome To Skyline Estates</h1>
    <p>Luxury Living in Dubai Awaits</p>

    </div>

    <p class="acc">Don't have an account? <a href="./signup.html">Sign-Up</a></p>
    <h5>OR</h5>
    <div class="loginwith">
    <a href="#"><img src="../assets/facebook-logo.svg"></a>
    <a href="#"><img src="../assets/twitterX-logo.svg"></a>
    <a href="#"><img src="../assets/medium-logo.svg"></a>
    </div>
    </form>
    </div>
    </div>
</body>    
</body>
</html>
